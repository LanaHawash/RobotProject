tracker_type: bytetrack

# Detection confidence levels used internally by the tracker
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.30

# Keep a missing track alive longer
track_buffer: 60

# More tolerant matching between the old and new bounding boxes
match_thresh: 0.90

# Combine confidence and spatial matching
fuse_score: true